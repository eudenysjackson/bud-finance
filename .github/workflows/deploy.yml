name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject environment variables into firebase-config.js
        env:
          FIREBASE_API_KEY:               ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:           ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:            ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:        ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID:   ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:                ${{ secrets.FIREBASE_APP_ID }}
          BACKEND_URL:                    ${{ secrets.BACKEND_URL }}
          EMAILJS_PUBLIC_KEY:             ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID:             ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_BOAS_VINDAS:   ${{ secrets.EMAILJS_TEMPLATE_BOAS_VINDAS }}
          EMAILJS_TEMPLATE_RECUPERAR_SENHA: ${{ secrets.EMAILJS_TEMPLATE_RECUPERAR_SENHA }}
          RECAPTCHA_SITE_KEY:             ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: sh inject-env.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
