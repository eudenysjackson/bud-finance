name: Notificações Push Diárias

on:
  schedule:
    # Roda todo dia às 11:00 UTC = 08:00 Brasília
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Permite disparar manualmente pelo GitHub Actions

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acionar cron de notificações
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -f -X GET -H "x-cron-secret: ${CRON_SECRET}" "https://bud-finance-backend.onrender.com/api/notifications/daily"
