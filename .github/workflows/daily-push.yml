name: Daily Push Notifications

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -f -X GET -H "x-cron-secret: ${CRON_SECRET}" "https://bud-finance-backend.onrender.com/api/notifications/daily"
