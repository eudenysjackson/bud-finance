<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Recuperar senha — Bud Finance">
  <title>Recuperar Senha - Bud Finance</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (build estático) -->
  <link rel="stylesheet" href="css/tailwind.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    /* ── Blobs (same as login for visual consistency) ─── */
    .blob { position: absolute; border-radius: 9999px; pointer-events: none; z-index: 0; }
    .blob-blue { top:0; left:0; width:40%; height:40%; background:rgba(147,197,253,0.4); filter:blur(100px); }
    .blob-cyan { bottom:0; right:0; width:30%; height:30%; background:rgba(103,232,249,0.3); filter:blur(100px); }

    /* ── Glass card (consistent with login) ─────────── */
    .recover-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      padding: 1.5rem; border-radius: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
      width: 100%; max-width: 24rem;
      position: relative; z-index: 10;
      margin: 0 1rem; border: 1px solid #fff;
    }
    @media (min-width:768px) { .recover-card { padding: 2rem; } }

    /* ── Form elements ─────────────────────────────── */
    .bud-label { display:block; font-size:.75rem; font-weight:700; color:#334155; margin-bottom:.375rem; }
    .bud-input {
      width:100%; padding:.625rem 1rem; border-radius:.75rem;
      border:2px solid #f1f5f9; background:#f8fafc;
      font-size:.875rem; font-weight:500; color:#1e293b;
      outline:none; transition:background-color .2s,border-color .2s; font-family:inherit;
    }
    .bud-input::placeholder { color:#94a3b8; }
    .bud-input:focus { background:#fff; border-color:#3b82f6; }

    /* ── Button ────────────────────────────────────── */
    .bud-btn-primary {
      width:100%; background:#2563eb; color:#fff; font-weight:800;
      padding:.75rem; border-radius:.75rem; border:none; font-size:1rem;
      cursor:pointer; box-shadow:0 10px 15px -3px rgba(37,99,235,0.3);
      transition:background-color .2s,transform .1s; font-family:inherit; margin-top:.5rem;
    }
    .bud-btn-primary:hover { background:#1d4ed8; }
    .bud-btn-primary:active { transform:scale(0.98); }
    .bud-btn-primary:disabled { opacity:.65; cursor:not-allowed; }
    .bud-btn-success {
      background:#10b981 !important;
      box-shadow:0 10px 15px -3px rgba(16,185,129,0.3) !important;
    }

    /* ── Link ──────────────────────────────────────── */
    .link-primary { color:#2563eb; font-weight:700; text-decoration:none; transition:color .2s; }
    .link-primary:hover { color:#1d4ed8; text-decoration:underline; }
  </style>
</head>
<body>

  <!-- Blobs -->
  <div class="blob blob-blue" aria-hidden="true"></div>
  <div class="blob blob-cyan" aria-hidden="true"></div>

  <!-- ═══ Card ═══ -->
  <div class="recover-card" role="main">

    <!-- Header -->
    <div style="text-align:center;margin-bottom:1.25rem;">
      <div style="width:3rem;height:3rem;border-radius:50%;background:#dbeafe;
                  display:inline-flex;align-items:center;justify-content:center;
                  font-size:1.25rem;margin-bottom:.75rem;">
        🔒
      </div>
      <h2 style="font-size:1.25rem;font-weight:800;color:#1e293b;letter-spacing:-.025em;">Esqueceu a senha?</h2>
      <p style="font-size:.75rem;color:#64748b;margin-top:.375rem;font-weight:500;line-height:1.5;">
        Informe seu e-mail e enviaremos um link para redefinir sua senha.
      </p>
    </div>

    <!-- Form -->
    <form id="formRecuperar" method="post" novalidate>
      <div style="margin-bottom:.75rem;">
        <label for="email" class="bud-label">E-mail cadastrado</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="seu@email.com" class="bud-input" required>
      </div>

      <button type="submit" id="btnRecuperar" class="bud-btn-primary">
        Enviar link de recuperação
      </button>
    </form>

    <!-- Link back -->
    <div style="text-align:center;margin-top:1rem;">
      <a href="index.html" class="link-primary" style="font-size:.875rem;">
        ← Voltar para o login
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/bud-utils.js"></script>
  <script src="js/recuperar-senha.js"></script>
</body>
</html>
