<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="js/app-shell.js?v=20261102-mobile"></script>
  <script defer src="js/category-picker.js?v=20261102-mobile2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Bud Finance — Controle financeiro inteligente">
  <title>Login - Bud Finance</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="marca-login.webp">
  <link rel="apple-touch-icon" href="icons/bud-selo-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bud Finance">

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (build estático) -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Estilos do login -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #dbe8f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
    }

    /* ── Splash screen ────────────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0;
      background: #dbe8f7;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem;
      z-index: 99999;
      transition: opacity .5s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 800; color: #2563eb;
      animation: pulse-logo 1.8s ease-in-out infinite;
      border: 1px solid rgba(191,219,254,.5);
    }
    .splash-bar {
      width: 120px; height: 4px; border-radius: 2px;
      background: #e2e8f0; overflow: hidden;
    }
    .splash-bar-inner {
      width: 40%; height: 100%; border-radius: 2px;
      background: #3b82f6;
      animation: slide-bar 1.2s ease-in-out infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    @keyframes slide-bar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .login-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 25rem);
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 6vw, 4.5rem);
      width: min(100%, 65rem);
      padding: clamp(1.5rem, 5vw, 3.5rem);
    }
    .login-mascot {
      display: block;
      width: min(100%, 27rem);
      height: auto;
      justify-self: center;
    }
    .login-card {
      min-width: 0;
      background: #fff;
      border-radius: 1.625rem;
      padding: clamp(1.5rem, 4vw, 2.25rem);
      box-shadow: 0 18px 54px #243f6c12;
    }
    @media (max-width: 690px) {
      .login-layout {
        grid-template-columns: minmax(0, 27rem);
        gap: 0.25rem;
        padding: 0.75rem 1rem 1.75rem;
      }
      .login-mascot { width: clamp(8rem, 36vw, 10rem); }
      .login-card { border-radius: 1.25rem; }
      .login-card .bud-input { font-size: 1rem; }
    }

    /* ── Form elements ───────────────────────────────────────────── */
    .bud-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.375rem;
    }
    .bud-input {
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #f1f5f9;
      background: #f8fafc;
      font-size: 0.875rem;
      font-weight: 500;
      color: #1e293b;
      outline: none;
      transition: background-color .2s, border-color .2s;
      font-family: inherit;
    }
    .bud-input::placeholder { color: #94a3b8; }
    .bud-input:focus {
      background: #fff;
      border-color: #3b82f6;
    }

    /* ── Button ──────────────────────────────────────────────────── */
    .bud-btn-primary {
      width: 100%;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(37,99,235,0.3);
      transition: background-color .2s, transform .1s;
      font-family: inherit;
      margin-top: 0.5rem;
    }
    .bud-btn-primary:hover { background: #1d4ed8; }
    .bud-btn-primary:active { transform: scale(0.98); }
    .bud-btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ── Misc ────────────────────────────────────────────────────── */
    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #1d4ed8;
      font: 700 0.8125rem/1 Inter, system-ui, sans-serif;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    .toggle-pw:hover { color: #1e3a8a; }
    .link-primary {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
      transition: color .2s;
    }
    .link-primary:hover { color: #1d4ed8; text-decoration: underline; }
  </style>
</head>
<body>

  <!-- ═══ Splash screen ════════════════════════════════════════════ -->
  <div id="splash">
    <img src="logo.png" alt="Bud Finance" style="width:56px;height:56px;object-fit:contain;animation:pulse-logo 1.8s ease-in-out infinite;">
    <div class="splash-bar"><div class="splash-bar-inner"></div></div>
  </div>

  <main class="login-layout">
    <img class="login-mascot" src="mascote-login.webp" alt="" width="560" height="544">
    <section class="login-card" aria-labelledby="login-title">

      <!-- Logo + Título -->
      <div style="text-align:center;margin-bottom:1.25rem;">
        <img src="marca-login.webp" alt="Bud Soluções" width="72" height="72"
             style="width:4.5rem;height:4.5rem;border-radius:50%;object-fit:contain;margin:0 auto 0.75rem;display:block;">
        <h1 id="login-title" style="font-size:1.5rem;font-weight:800;color:#14233a;letter-spacing:-0.035em;">Bem-vindo(a)</h1>
        <p style="font-size:0.75rem;color:#64748b;margin-top:0.375rem;font-weight:500;">Insira seus dados de acesso</p>
      </div>

      <!-- Form -->
      <form id="formLogin" method="get" autocomplete="on" novalidate>

        <!-- Input: Email / Matrícula -->
        <div style="margin-bottom:1rem;">
          <label for="identificador" class="bud-label">E-mail ou Matrícula</label>
          <input
            type="text"
            id="identificador"
            name="identificador"
            autocomplete="username"
            placeholder="seu@email.com ou BUD-XXXX-XXXX"
            class="bud-input"
            required
          >
        </div>

        <!-- Input: Senha -->
        <div style="margin-bottom:0.25rem;">
          <label for="senha" class="bud-label">Senha</label>
          <div style="position:relative;">
            <input
              type="password"
              id="senha"
              name="senha"
              autocomplete="current-password"
              placeholder="••••••••"
              class="bud-input"
              style="padding-right:5.5rem;"
              required
            >
            <button type="button" id="toggleSenha" class="toggle-pw" aria-label="Mostrar senha" aria-controls="senha">Mostrar</button>
          </div>
          <div style="text-align:right;margin-top:0.375rem;">
            <a href="recuperar-senha.html" class="link-primary" style="font-size:0.75rem;">Esqueceu a senha?</a>
          </div>
        </div>

        <!-- Botão Login -->
        <button type="submit" id="btnLogin" class="bud-btn-primary">
          Acessar meu painel
        </button>
      </form>

      <!-- Link Cadastro -->
      <div style="text-align:center;margin-top:1rem;">
        <p style="font-size:0.875rem;color:#64748b;font-weight:500;">
          Novo por aqui?
          <a href="cadastro.html" class="link-primary">Crie sua conta</a>
        </p>
      </div>

      <!-- Footer LGPD -->
      <div style="text-align:center;margin-top:1rem;padding-top:0.75rem;border-top:1px solid #f1f5f9;">
        <p style="font-size:11px;color:#94a3b8;">
          Ao acessar, você concorda com nossa
          <a href="politica-privacidade.html" target="_blank" rel="noopener noreferrer"
             style="color:#3b82f6;font-weight:500;text-decoration:none;">
            Política de Privacidade
          </a>
          e com o tratamento dos seus dados conforme a LGPD.
        </p>
      </div>
    </section>
  </main>

  <!-- ═══ Scripts ══════════════════════════════════════════════════ -->
  <!-- Firebase config (exposes window.BUD_FIREBASE_CONFIG) -->
  <script src="js/firebase-config.js"></script>
  <!-- Global utils (exposes window.budShowToast, window.budSanitize) -->
  <script src="js/bud-utils.js?v=20261104-planos"></script>
  <!-- Login logic (ES Module) -->
  <script type="module" src="js/index.js?v=20261111-login-visual"></script>

  <!-- Splash dismiss -->
  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      // Dismiss after fonts + firebase module loads (min 700ms, max 6s)
      var minTime = 0; // sem espera mínima artificial
      var start = Date.now();
      window.addEventListener('load', function () {
        var elapsed = Date.now() - start;
        var remaining = Math.max(0, 0 - elapsed); // sem espera mínima artificial
        setTimeout(function () {
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 600);
        }, remaining);
      });
      // Safety: force dismiss after 6s
      setTimeout(function () {
        if (splash.parentNode) {
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 600);
        }
      }, 6000);
    })();
  </script>
</body>
</html>
