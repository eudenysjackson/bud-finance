<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Pagamento · Bud Finance</title>
<link rel="icon" type="image/png" href="icons/bud-selo-192.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://bud-finance-backend.onrender.com" crossorigin>
<link rel="modulepreload" href="js/assinar.js?v=20261127-direct">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3fb;color:#102039;font:16px/1.6 Arial,Helvetica,sans-serif}
section{box-sizing:border-box;width:min(92%,400px);padding:30px;text-align:center;background:#fff;border:1px solid #dce6f5;border-radius:24px}
img{display:block;margin:0 auto 18px}h1{font-size:23px;line-height:1.3;letter-spacing:-.5px}p{font-size:14px;color:#596c86}
button{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#1654ed;color:white;font:700 14px Arial;cursor:pointer;margin:10px 0}
button:disabled{opacity:.6;cursor:wait}a{color:#1654ed;font-size:14px}#checkoutEntryError{color:#b42318}[hidden]{display:none!important}
</style>
<script src="js/checkout-entry.js?v=20261127-direct"></script>
</head>
<body>
<section id="checkoutEntry" role="status" aria-live="polite">
<img src="icons/bud-selo-192.png" alt="Bud Finance" width="64" height="64" fetchpriority="low">
<h1>Abrindo pagamento <span id="checkoutEntryPlan"></span></h1>
<p id="checkoutEntryStatus">Estamos preparando seu checkout seguro.</p>
<p id="checkoutEntryError" role="alert"></p>
<button id="checkoutRetry" type="button" hidden>Tentar novamente</button>
<button id="checkoutLogin" type="button" hidden>Entrar novamente</button>
<p><a id="checkoutManage" href="configuracoes?aba=dados" hidden>Gerenciar meu plano</a></p>
<a href="dashboard">Voltar ao app</a>
<noscript><p>Ative o JavaScript para continuar para o pagamento.</p></noscript>
</section>
<script src="js/firebase-config.js"></script>
<script>window.BudCheckoutEntry?.warm();</script>
<script type="module" src="js/assinar.js?v=20261127-direct" onerror="window.BudCheckoutEntry?.showError()"></script>
</body></html>
