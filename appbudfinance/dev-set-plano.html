<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dev — Alterar Plano</title>
  <style>
    body { font-family: sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#0f172a; color:#f1f5f9; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:2rem; width:340px; }
    h2 { margin:0 0 0.25rem; font-size:1.1rem; }
    p  { margin:0 0 1.2rem; font-size:.85rem; color:#94a3b8; }
    .badge { display:inline-block; background:#0ea5e9; color:#fff; font-size:.75rem; padding:.2rem .6rem; border-radius:999px; margin-bottom:1rem; }
    input, select { width:100%; padding:.6rem .8rem; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#f1f5f9; font-size:1rem; margin-bottom:.75rem; box-sizing:border-box; }
    button { width:100%; padding:.7rem; border-radius:8px; border:none; background:#6366f1; color:#fff; font-size:1rem; cursor:pointer; font-weight:600; }
    button:hover { background:#4f46e5; }
    button:disabled { background:#334155; cursor:not-allowed; }
    .msg { margin-top:1rem; padding:.75rem; border-radius:8px; font-size:.875rem; text-align:center; display:none; }
    .msg.ok  { background:#064e3b; color:#6ee7b7; display:block; }
    .msg.err { background:#7f1d1d; color:#fca5a5; display:block; }
    .user-info { font-size:.8rem; color:#64748b; margin-bottom:1rem; word-break:break-all; }
    hr { border:none; border-top:1px solid #334155; margin:1.25rem 0; }
    label { font-size:.8rem; color:#94a3b8; display:block; margin-bottom:.25rem; }
  </style>
</head>
<body>
<div class="card">
  <span class="badge">🛠 DEV TOOL</span>
  <h2>Alterar plano do usuário</h2>
  <p>Use apenas em desenvolvimento.</p>

  <!-- Login section (visível quando não logado) -->
  <div id="secaoLogin">
    <label>E-mail</label>
    <input type="email" id="devEmail" placeholder="seu@email.com" autocomplete="email">
    <label>Senha</label>
    <input type="password" id="devSenha" placeholder="••••••••" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div class="msg" id="msgLogin"></div>
  </div>

  <!-- Plano section (visível quando logado) -->
  <div id="secaoPlano" style="display:none">
    <div class="user-info" id="userInfo"></div>
    <hr>
    <label>Novo plano</label>
    <select id="selPlano">
      <option value="free">Free (Gratuito)</option>
      <option value="starter">Starter</option>
      <option value="plus" selected>Plus ★</option>
      <option value="pro">Pro</option>
      <option value="trial">Trial</option>
    </select>
    <button id="btnSalvar">Salvar plano</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script type="module">
import { initializeApp }    from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
                            from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
import { getFirestore, doc, updateDoc }
                            from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';

const app  = initializeApp(window.BUD_FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const secaoLogin  = document.getElementById('secaoLogin');
const secaoPlano  = document.getElementById('secaoPlano');
const btnLogin    = document.getElementById('btnLogin');
const btnSalvar   = document.getElementById('btnSalvar');
const selPlano    = document.getElementById('selPlano');
const userInfo    = document.getElementById('userInfo');
const msg         = document.getElementById('msg');
const msgLogin    = document.getElementById('msgLogin');

let currentUID = null;

onAuthStateChanged(auth, user => {
  if (user) {
    currentUID = user.uid;
    userInfo.textContent = `Logado como: ${user.email}`;
    secaoLogin.style.display = 'none';
    secaoPlano.style.display = 'block';
  } else {
    currentUID = null;
    secaoLogin.style.display = 'block';
    secaoPlano.style.display = 'none';
  }
});

btnLogin.addEventListener('click', async () => {
  const email = document.getElementById('devEmail').value.trim();
  const senha  = document.getElementById('devSenha').value;
  if (!email || !senha) return;
  msgLogin.className = 'msg';
  msgLogin.textContent = '';
  btnLogin.disabled = true;
  btnLogin.textContent = 'Entrando...';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged vai trocar a view automaticamente
  } catch (e) {
    msgLogin.className = 'msg err';
    msgLogin.textContent = `❌ ${e.message}`;
    btnLogin.disabled = false;
    btnLogin.textContent = 'Entrar';
  }
});

btnSalvar.addEventListener('click', async () => {
  if (!currentUID) return;
  msg.className = 'msg';
  msg.textContent = '';
  btnSalvar.disabled = true;
  btnSalvar.textContent = 'Salvando...';
  try {
    await updateDoc(doc(db, 'usuarios', currentUID), { plano: selPlano.value });
    msg.className = 'msg ok';
    msg.textContent = `✅ Plano alterado para "${selPlano.value}" com sucesso!`;
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = `❌ Erro: ${e.message}`;
  }
  btnSalvar.disabled = false;
  btnSalvar.textContent = 'Salvar plano';
});
</script>
</body>
</html>
