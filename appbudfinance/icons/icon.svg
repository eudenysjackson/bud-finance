<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fundo: gradiente dark navy → teal escuro -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="55%"  stop-color="#0c3d5a"/>
      <stop offset="100%" stop-color="#072637"/>
    </linearGradient>

    <!-- Glass shine: brilho superior esquerdo -->
    <radialGradient id="shine" cx="170" cy="115" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Letra B: azul claro → azul médio -->
    <linearGradient id="bGrad" x1="256" y1="75" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Seta gráfico: teal → verde -->
    <linearGradient id="arrowGrad" x1="55" y1="455" x2="450" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Clip para cantos arredondados -->
    <clipPath id="rc">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Efeito glass: brilho superior -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <g clip-path="url(#rc)">
    <!-- Anéis decorativos glassmorphic -->
    <circle cx="445" cy="445" r="255" fill="none" stroke="#0e7490" stroke-width="2"   opacity="0.22"/>
    <circle cx="65"  cy="45"  r="195" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.10"/>

    <!-- Barra de reflexo inferior (glass) -->
    <rect x="0" y="450" width="512" height="62" fill="rgba(255,255,255,0.045)"/>

    <!-- Letra B principal -->
    <text
      x="256"
      y="355"
      text-anchor="middle"
      font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
      font-weight="900"
      font-size="305"
      fill="url(#bGrad)"
      opacity="0.96">B</text>

    <!-- Linha do gráfico (stock chart) -->
    <polyline
      points="60,448 152,370 222,406 328,295 435,186"
      fill="none"
      stroke="url(#arrowGrad)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.90"/>

    <!-- Cabeça da seta -->
    <polygon points="435,186 404,218 452,220" fill="#22c55e" opacity="0.95"/>

    <!-- Sinal $ (acento da marca) -->
    <text
      x="390"
      y="460"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-weight="700"
      font-size="46"
      fill="#2dd4bf"
      opacity="0.65">$</text>
  </g>
</svg>
