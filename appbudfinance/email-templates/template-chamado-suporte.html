<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>Novo Chamado — Bud Finance</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;word-spacing:normal;background-color:#f0f4f8;font-family:'Inter',Arial,Helvetica,sans-serif;">
  <!-- Wrapper -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f0f4f8;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card principal (max 560px) -->
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">

          <!-- Header -->
          <tr>
            <td style="padding:28px 28px 20px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <!-- Logo preta (fundo claro) -->
                  <td width="44" valign="middle">
                    <img src="https://raw.githubusercontent.com/eudenysjackson/bud-finance/master/logopreta.png" alt="Bud Finance" width="40" height="40" style="display:block;width:40px;height:40px;border:0;">
                  </td>
                  <!-- Título -->
                  <td valign="middle" style="padding-left:12px;">
                    <p style="margin:0;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;">
                      Bud Finance · Suporte
                    </p>
                    <p style="margin:4px 0 0;font-size:18px;font-weight:800;color:#1e293b;letter-spacing:-0.025em;">
                      Novo Chamado Recebido
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 28px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="border-top:1px solid #f1f5f9;"></td></tr>
              </table>
            </td>
          </tr>

          <!-- Badge do tipo -->
          <tr>
            <td style="padding:20px 28px 0;">
              <!--[if mso]>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td style="background-color:#fee2e2;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#dc2626;font-family:Arial,sans-serif;">{{tipo}}</td></tr></table>
              <![endif]-->
              <!--[if !mso]><!-->
              <span style="display:inline-block;background-color:#fee2e2;color:#dc2626;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;font-family:'Inter',Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:0.04em;">
                {{tipo}}
              </span>
              <!--<![endif]-->
            </td>
          </tr>

          <!-- Dados do chamado -->
          <tr>
            <td style="padding:20px 28px 0;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;">
                <tr>
                  <td style="padding:20px 24px;">
                    <!-- Tipo -->
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td width="90" valign="top" style="font-size:12px;font-weight:700;color:#94a3b8;padding-bottom:12px;text-transform:uppercase;letter-spacing:0.04em;">
                          Tipo
                        </td>
                        <td valign="top" style="font-size:14px;font-weight:600;color:#1e293b;padding-bottom:12px;">
                          {{tipo}}
                        </td>
                      </tr>
                      <!-- Usuário -->
                      <tr>
                        <td width="90" valign="top" style="font-size:12px;font-weight:700;color:#94a3b8;padding-bottom:12px;text-transform:uppercase;letter-spacing:0.04em;">
                          Usuário
                        </td>
                        <td valign="top" style="font-size:14px;font-weight:600;color:#1e293b;padding-bottom:12px;">
                          {{to_name}}
                        </td>
                      </tr>
                      <!-- Email -->
                      <tr>
                        <td width="90" valign="top" style="font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.04em;">
                          E-mail
                        </td>
                        <td valign="top" style="font-size:14px;font-weight:600;color:#1e293b;">
                          {{to_email}}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Descrição -->
          <tr>
            <td style="padding:20px 28px 0;">
              <p style="margin:0 0 8px;font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.04em;">
                Descrição
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#eff6ff;border-left:4px solid #2563eb;border-radius:0 12px 12px 0;">
                <tr>
                  <td style="padding:16px 20px;">
                    <p style="margin:0;font-size:14px;color:#1e293b;line-height:1.7;white-space:pre-wrap;">{{message}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Dica de ação -->
          <tr>
            <td align="center" style="padding:24px 28px 8px;">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{admin_url}}" style="height:44px;v-text-anchor:middle;width:240px;" arcsize="16%" fillcolor="#2563eb" stroke="f">
                <w:anchorlock/>
                <center style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:800;">Ver no Painel Admin</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <a href="{{admin_url}}"
                 target="_blank"
                 rel="noopener noreferrer"
                 style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:14px;font-weight:800;font-family:'Inter',Arial,Helvetica,sans-serif;text-decoration:none;padding:12px 32px;border-radius:10px;line-height:1;box-shadow:0 4px 12px rgba(37,99,235,0.3);">
                Ver no Painel Admin
              </a>
              <!--<![endif]-->
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 28px 28px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="border-top:1px solid #f1f5f9;padding-top:20px;">
                    <p style="margin:0;font-size:11px;color:#94a3b8;line-height:1.5;text-align:center;">
                      Notificação automática do <strong>Bud Finance</strong>.<br>
                      Este e-mail é destinado apenas ao administrador do sistema.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>
  <!-- /Wrapper -->
</body>
</html>
